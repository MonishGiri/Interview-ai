services:
  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: interview-ai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: interview-ai-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
